# VPS nginx config (docker-compose_vps.yml only — nginx/nginx.conf remains
# the separate local dev/dry-run config, untouched by this file).
#
# This is the file actually mounted into the cbb-nginx container
# (docker-compose_vps.yml: ./nginx/nginx.vps.conf:/etc/nginx/nginx.conf:ro).
# It ships checked in as-is in "bootstrap" form: plain HTTP on port 80 only.
# That's deliberate — certbot's webroot method (used by
# scripts/setup-nginx-ssl.sh) needs a real, already-working HTTP server on
# port 80 to complete the ACME http-01 challenge before a certificate
# exists, so nginx can't start out requiring one.
#
# Once scripts/setup-nginx-ssl.sh successfully obtains a certificate for
# your domain, it OVERWRITES this exact file with the HTTPS-enabled version
# rendered from nginx/nginx.vps.ssl.conf.template (port 80 becomes an
# ACME-challenge-plus-redirect-to-443 server, and a new port 443 server
# block does the real proxying with the obtained certificate). Re-running
# scripts/setup-nginx-ssl.sh (e.g. for renewal) regenerates and reloads it
# again; it's idempotent either way. See that script and template for the
# HTTPS version's exact contents.
#
# Routing (same path-based scheme as nginx/nginx.conf's dev config, plus
# the Supabase API proxy explained below):
#   /                        -> landing:3000  (no basePath, owns "/")
#   /app/*                   -> app:3001      (basePath "/app", not stripped)
#   /admin/*                 -> admin:3002    (basePath "/admin", not stripped)
#   /auth/v1/, /rest/v1/,
#   /storage/v1/, /realtime/v1/,
#   /functions/v1/           -> api-gw:8000   (Supabase's own API paths)
#
# Why proxy Supabase's API here (unlike the dev nginx.conf, which explicitly
# does NOT do this): the dev config relies on Supabase's api-gw having its
# port published straight to the host (http://localhost:8000), which is
# fine on a dev laptop but would violate this VPS deploy's "only nginx is
# publicly reachable" rule (see docker-compose_vps.yml's header comment).
# So here nginx reverse-proxies Supabase's own well-known API path prefixes
# through to api-gw:8000 over the container network instead, on the SAME
# public origin as the three Next.js apps. Envoy (api-gw) does its own
# internal sub-routing once it receives these paths (see
# supabase/volumes/api/envoy/lds.template.yaml) — nginx forwards the full
# path unmodified, no rewrite needed.
#
# Practical consequence: apps/app and apps/admin's Dockerfiles bake
# NEXT_PUBLIC_SUPABASE_URL into the client bundle at build time (it's a
# browser-reachable address, per those Dockerfiles' own comments) — for a
# VPS build this must be your public https://<domain> (no port), not a
# Supabase-specific host/port, so the browser's Supabase client calls land
# on this same nginx origin and get proxied through correctly. See
# README.md "VPS deployment".

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream app_upstream {
        server app:3001;
    }

    upstream admin_upstream {
        server admin:3002;
    }

    upstream landing_upstream {
        server landing:3000;
    }

    upstream supabase_upstream {
        server api-gw:8000;
    }

    server {
        listen 80;
        server_name _;

        # Required for certbot's webroot method (scripts/setup-nginx-ssl.sh)
        # to complete the ACME http-01 challenge, both for the first
        # certificate and for renewals afterward.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Next.js/Supabase auth cookie handling cares about these headers
        # being set correctly (Host, and the X-Forwarded-* pair), so every
        # location below sets the same proxy headers.

        location ~ ^/(auth|rest|storage|realtime|functions)/v1/ {
            proxy_pass http://supabase_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /app/ {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /admin/ {
            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
