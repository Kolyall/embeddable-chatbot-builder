# Local dev / dry-run nginx config (docker-compose.yml "containers" profile
# only — this is NOT the day-to-day dev workflow, which is host-run
# `pnpm dev` via Turborepo). Path-based routing on one origin per Decision 27:
#   /         -> landing:3000  (no basePath, owns "/")
#   /app/*    -> app:3001      (basePath "/app", NOT stripped — the Next app
#                                already expects the full "/app/..." path)
#   /admin/*  -> admin:3002    (basePath "/admin", NOT stripped, same reason)
#
# Decision: Supabase's own gateway (api-gw, port 8000) is intentionally NOT
# proxied through nginx here. The browser-side Supabase client needs a
# browser-reachable URL (it can't resolve container hostnames like
# "api-gw"), and Supabase's docker-compose.yml already publishes api-gw's
# port 8000 straight to the host. So the simplest correct setup for this
# MVP's scope is: browser hits nginx on :80 for the three Next.js apps, and
# hits Supabase directly on localhost:8000 (already exposed) — no need to
# also reverse-proxy Supabase's REST/Auth/Storage APIs through nginx.
# Server-side (container-to-container) Supabase calls use the container
# network address http://api-gw:8000 directly (see docker-compose.yml).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream app_upstream {
        server app:3001;
    }

    upstream admin_upstream {
        server admin:3002;
    }

    upstream landing_upstream {
        server landing:3000;
    }

    server {
        listen 80;
        server_name _;

        # Next.js/Supabase auth cookie handling cares about these headers
        # being set correctly (Host, and the X-Forwarded-* pair), so every
        # location sets the same proxy headers.

        location /app/ {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /admin/ {
            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
